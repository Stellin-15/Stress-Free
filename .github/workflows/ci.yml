name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            Python Version/requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r "Python Version/requirements.txt" -r requirements-dev.txt

      - name: Ruff
        run: ruff check --output-format=github .

      - name: Pytest
        run: pytest -v

  build:
    name: Build exe (smoke test)
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            Python Version/requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r "Python Version/requirements.txt" -r requirements-dev.txt

      - name: PyInstaller
        working-directory: Python Version
        run: pyinstaller --noconfirm OrbitMousePro.spec

      - name: Check exe exists
        shell: pwsh
        run: |
          $exe = Get-Item "Python Version/dist/OrbitMousePro.exe"
          "Built $($exe.Name): $([math]::Round($exe.Length / 1MB, 1)) MB"
