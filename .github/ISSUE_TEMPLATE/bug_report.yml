name: Bug report
description: Something isn't working the way it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe what you saw, and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Select STEALTH
        2. Click ENGAGE ORBIT
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Orbit version
      description: Shown under the ORBIT title in the app (e.g. v1.2.0).
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options: [Windows 11, Windows 10, Other]
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: How are you running it?
      options: [Installer (.exe), From source (python)]
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, multiple monitors, display scaling, the app whose status didn't stay active, etc.
